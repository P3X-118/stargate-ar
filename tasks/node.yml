- name: Check if node certificate exists on DHD
  ansible.builtin.stat:
    path: /etc/stargate/{{ inventory_hostname }}.crt
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  register: cert_stat

- name: Get information about existing certificate (if it exists)
  ansible.builtin.command: "/etc/stargate/nebula-cert print -json -path /etc/stargate/{{ inventory_hostname }}.crt"
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  changed_when: false
  when: cert_stat.stat.exists
  register: current_cert_json
  ignore_errors: yes

- name: Parse the IP address from the certificate details (if it exists)
  ansible.builtin.set_fact:
    current_cert_ip: "{{ current_cert_json.stdout | from_json | json_query('details.ips[0]') }}"
  when:
    - cert_stat.stat.exists
    - current_cert_json.stdout != ""

- name: Print IP address from cert (if one exists)
  ansible.builtin.debug:
    msg: "IP Address in Cert: {{ current_cert_ip }}, Expected IP Address: {{ dhd_internal_ip_addr }}/{{ dhd_network_cidr }}"
  when: cert_stat.stat.exists

- name: Delete invalid node certificate and key from lighthouse (wrong IP address)
  ansible.builtin.file:
    path: "/etc/stargate/{{ item }}"
    state: absent
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  with_items:
    - "{{ inventory_hostname }}.crt"
    - "{{ inventory_hostname }}.key"
  when:
    - cert_stat.stat.exists
    - current_cert_ip != dhd_internal_ip_addr|string + '/' + dhd_network_cidr|string

- name: Ensure a cert/key exists for each DHD node
  ansible.builtin.command:
    chdir: /etc/stargate
    cmd: ./nebula-cert sign -name "{{ inventory_hostname }}" -ip "{{ dhd_internal_ip_addr }}/{{ dhd_network_cidr }}" -duration "{{ dhd_client_cert_duration }}"
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  when: not cert_stat.stat.exists or current_cert_ip != dhd_internal_ip_addr|string + '/' + dhd_network_cidr|string

- name: Ensure DHD has hosts file entry for node
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ dhd_internal_ip_addr }} {{ inventory_hostname }}.dhd"
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  when: stargate_dhd_build_hosts_file

- name: Ensure node has hosts file entry for lighthouse
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ stargate_dhd_internal_ip_addr }} {{ stargate_dhd_hostname }}.dhd"
  when: stargate_node_dhd_in_hosts_file

- name: Read cert/key from DHD
  ansible.builtin.slurp:
    src: "/etc/stargate/{{ item }}"
  register: dhd_files
  delegate_to: "{{ groups.stargate_dhd[0] }}"
  with_items: 
    - "{{ inventory_hostname }}.crt"
    - "{{ inventory_hostname }}.key"
    - ca.crt

- name: Ensure Cert, Key, CA files exist
  ansible.builtin.copy:
    dest: "/etc/stargate/{{ item['item'] }}"
    content: "{{ item['content'] | b64decode }}"
    owner: root
    group: root
    mode: 0600
  loop: "{{ dhd_files.results }}"
  loop_control:
    label: "{{ item['item'] }}"

- name: Ensure DHD is configured
  ansible.builtin.template:
    src: node_config.yml.j2 
    dest: /etc/stargate/config.yml
    owner: root
    group: root
    mode: '0400'
  notify: restart stargate

- name: Ensure Stargate service exists
  ansible.builtin.template:
    src: node.service.j2
    dest: /etc/systemd/system/stargate.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure Stargate service is enabled and running
  ansible.builtin.systemd: 
    name: stargate
    daemon_reload: yes
    enabled: yes
    masked: no
    state: started

- name: Ensure dhd-check is present
  ansible.builtin.template:
    src: dhd-check.sh.j2
    dest: /etc/stargate/dhd-check.sh
    owner: root
    group: root
    mode: '0755'
  when: dhd_install_check_cron|bool

- name: Ensure dhd-check is scheduled via cron
  ansible.builtin.cron:
    name: "dhd-check"
    minute: "{{ dhd_check_cron_minute | default('*/5') }}"
    job: "/etc/stargate/dhd-check.sh"
  when: dhd_install_check_cron|bool

