- name: Ensure /etc/stargate directory exists
  become: yes
  ansible.builtin.file:
    path: /etc/stargate
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Check for existing Nebula install
  become: yes
  ansible.builtin.stat:
    path: '/etc/stargate/nebula'
  register: installed_nebula_stats

- name: Get Nebula version (if installed)
  ansible.builtin.command: "/etc/stargate/nebula -version"
  register: installed_stargate_version_out
  changed_when: False
  failed_when: False
  when: installed_nebula_stats.stat.exists

- name: Extract Nebula version from command output
  ansible.builtin.set_fact:
    installed_stargate_version: "{{ installed_stargate_version_out.stdout.split(' ')[1] }}"
  when: installed_nebula_stats.stat.exists

- name: Download & Extract Nebula
  ansible.builtin.unarchive:
    src: "https://github.com/slackhq/nebula/releases/download/v{{ stargate_version }}/nebula-linux-{{ nebula_architectures[ansible_facts.architecture] }}.tar.gz"
    dest: "/etc/stargate"
    remote_src: yes
  when: (installed_stargate_version|default(stargate_version) != stargate_version) or (not installed_nebula_stats.stat.exists)
  notify: restart stargate

- name: Ensure Nebula binaries permissions are correct
  ansible.builtin.file:
    path: "/etc/stargate/{{ item }}"
    owner: root
    group: root
    mode: '0700'
  with_items:
    - nebula
    - nebula-cert

- name: Generate SSH host key for Nebula debug console
  ansible.builtin.command: ssh-keygen -t ed25519 -f /etc/stargate/ssh_host_ed25519_key -N ""
  args:
    creates: /etc/stargate/ssh_host_ed25519_key
  when: dhd_sshd_enabled

- name: Set SSH host key permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0600'
  with_items:
    - /etc/stargate/ssh_host_ed25519_key
    - /etc/stargate/ed25519_key.pub
  when: dhd_sshd_enabled

- name: Read SSH key files and build registry
  block:
    - name: Read all SSH key files
      slurp:
        src: "{{ item.1 }}"
      register: ssh_key_files
      failed_when: false
      loop: "{{ dhd_sshd_authorized_users | subelements('key_files', skip_missing=True) }}"

    - name: Build SSH key registry by username
      ansible.builtin.set_fact:
        dhd_sshd_key_registry: >-
          {{ dhd_sshd_key_registry | default({}) | combine({
            result.item.0.user: (dhd_sshd_key_registry | default({})).get(result.item.0.user, []) +
            [result.content | b64decode | trim]
          }) }}
      loop: "{{ ssh_key_files.results | selectattr('content', 'defined') | list }}"
      loop_control:
        loop_var: result
  when: dhd_sshd_enabled
