---
- name: Stargate Install
  block:
    - name: Uninstall Stargate (clean install)
      include_tasks: uninstall.yml
      when: stargate_clean_install|bool

    - name: Preflight checks
      include_tasks: preflight.yml

    - name: Install Stargate on all hosts 
      include_tasks: nebula.yml
    
    - name: Deploy DHD
      include_tasks: dhd.yml
      when: 
        - (inventory_hostname in groups.get('stargate_dhd', []) or inventory_hostname == 'localhost')
        - (stargate_install_ca_certs|bool or stargate_install_client_certs|bool or stargate_auto_generate_certs|bool)
    
    - name: Deploy Stargate Node
      include_tasks: node.yml
      when: inventory_hostname not in groups.get('stargate_dhd', []) or inventory_hostname == 'localhost'
  when: (inventory_hostname in groups.get('stargate_dhd', [])) or stargate_internal_ip_addr is defined or inventory_hostname == 'localhost'
